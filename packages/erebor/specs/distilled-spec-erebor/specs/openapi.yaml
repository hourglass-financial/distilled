  /simulation/international_wire_in:
    post:
      operationId: simulate-international-wire-in
      summary: Simulate Inbound International Wire Transfer
      description: >
        Simulate an inbound international wire transfer for testing purposes. This endpoint is only available in the
        sandbox environment.


        You can identify the destination account using either a `deposit_account_id` or an `account_number` +
        `routing_number` pair — provide exactly one. The originator fields synthesize the sending bank/account; the
        simulation get-or-creates a counterparty international bank account from these so subsequent counterparty
        list/get calls observe the new sender. USD-only on day 1.


        The response returns the new transfer's customer-facing ID with status `PENDING`. Settlement (`SETTLED`) is
        asynchronous — typically within seconds. Poll `GET /international_wire_in/{international_wire_in_id}` or listen
        for the `INTERNATIONAL_WIRE_IN.SETTLED` webhook to observe the transition.


        Idempotency: when retrying with the same `Erebor-Idempotency-Key`, the response reflects the existing row's
        current status (`PENDING` or `SETTLED`). A key reused across customers returns `409 Conflict` — regenerate the
        key.
      tags:
        - subpackage_simulation
      parameters:
        - name: Authorization
          in: header
          description: |
            Use your API key in the Authorization header.

            Example: `Authorization: your_api_key_here`
          required: true
          schema:
            type: string
        - name: Erebor-Idempotency-Key
          in: header
          description: >
            Optional idempotency key to safely retry requests. If provided, multiple requests with the same key will
            only perform the action once and return the same result (even if the result was an error).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: >-
            Inbound international wire transfer simulated successfully. Status returns `PENDING`; poll `GET
            /international_wire_in/{international_wire_in_id}` for `SETTLED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateInboundInternationalWireResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateInternationalWireInRequest'
