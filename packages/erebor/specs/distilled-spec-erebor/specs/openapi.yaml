components:
  schemas:
    BaseObject:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the object
        type:
          type: string
          description: The type of the object
        url:
          type: string
          format: uri
          description: The URL for the object
        created_at:
          type: string
          format: date-time
          description: When the object was created
        updated_at:
          type: string
          format: date-time
          description: When the object was last updated
      required:
        - id
        - type
        - url
        - created_at
        - updated_at
      title: BaseObject
    DocumentDocumentType:
      type: string
      enum:
        - US_DRIVERS_LICENSE
        - PASSPORT
        - FORMATION_DOCUMENT
        - IRS_EIN_CONFIRMATION
        - OTHER
      description: Type of document.
      title: DocumentDocumentType
    CustomRef:
      type: string
      description: >
        Free-text reference you can attach to a resource for your own bookkeeping (max 255 unicode characters). Echoed
        back unchanged on read. Distinct from `Erebor-Idempotency-Key` — not used for de-duplication.
      title: CustomRef
    CustomFields:
      type: object
      additionalProperties:
        description: Any type
      description: >
        JSON metadata you can attach to a resource for your own bookkeeping (max 4096 bytes when JSON-encoded). Echoed
        back unchanged on read. The empty object `{}` is a valid stored value.
      title: CustomFields
    Document:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the document, prefixed with `doc_`.
        type:
          type: string
          enum:
            - DOCUMENT
          description: Object type. Always `DOCUMENT`.
        url:
          type: string
          format: uri
          description: API URL for retrieving this document.
        created_at:
          type: string
          format: date-time
          description: Timestamp of when the document was created, in ISO 8601 format.
        updated_at:
          type: string
          format: date-time
          description: Timestamp of when the document was last updated, in ISO 8601 format.
        archived_at:
          type:
            - string
            - 'null'
          format: date-time
        program_id:
          type: string
          description: Unique identifier of the program this document belongs to, prefixed with `prgrm_`.
        name:
          type: string
          description: Original filename of the uploaded document.
        description:
          type:
            - string
            - 'null'
          description: Optional description of the document's contents.
        document_type:
          $ref: '#/components/schemas/DocumentDocumentType'
          description: Type of document.
        content_hash:
          type: string
          description: SHA-256 hash of the file contents, used to verify document integrity.
        content_size:
          type: integer
          description: File size in bytes.
        content_type:
          type: string
          description: MIME type of the uploaded file (e.g., `application/pdf`, `image/jpeg`).
        content_url:
          type: string
          format: uri
          description: Pre-signed URL for downloading the document contents.
        custom_ref:
          oneOf:
            - $ref: '#/components/schemas/CustomRef'
            - type: 'null'
        custom_fields:
          oneOf:
            - $ref: '#/components/schemas/CustomFields'
            - type: 'null'
      required:
        - id
        - type
        - url
        - created_at
        - updated_at
        - program_id
        - name
        - document_type
        - content_hash
        - content_size
        - content_type
        - content_url
      title: Document
    DOCUMENTS_listDocuments_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        has_more:
          type: boolean
        page_size:
          type: integer
        page_next:
          type:
            - string
            - 'null'
          format: uri
        page_prev:
          type:
            - string
            - 'null'
          format: uri
        url:
          type: string
          format: uri
      required:
        - data
        - has_more
        - page_size
        - url
      title: DOCUMENTS_listDocuments_Response_200
    DocumentsPostRequestBodyContentMultipartFormDataSchemaDocumentType:
      type: string
      enum:
        - US_DRIVERS_LICENSE
        - PASSPORT
        - FORMATION_DOCUMENT
        - IRS_EIN_CONFIRMATION
        - OTHER
      description: Type of document being uploaded
      title: DocumentsPostRequestBodyContentMultipartFormDataSchemaDocumentType
    UpdateDocumentRequest:
      type: object
      properties:
        custom_ref:
          $ref: '#/components/schemas/CustomRef'
        custom_fields:
          $ref: '#/components/schemas/CustomFields'
      title: UpdateDocumentRequest
    ErrorDetail:
      oneOf:
        - type: object
          properties:
            error_detail_type:
              type: string
              description: Discriminator indicating the kind of detail.
            field:
              type: string
              description: Dot-notated path to the field that failed validation.
            message:
              type: string
              description: Human-readable description of the failure.
          required:
            - error_detail_type
            - field
            - message
          description: FIELD_ERROR variant
      discriminator:
        propertyName: error_detail_type
      description: >-
        A structured error detail. Use `error_detail_type` to determine which fields are present. New detail types may
        be added in the future; consumers should ignore unrecognized values.
      title: ErrorDetail
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        field:
          type:
            - string
            - 'null'
          description: >-
            Deprecated: use error_details instead. Contains the field from the first error_details entry for backwards
            compatibility. May be removed in a future API version.
        docs_url:
          type:
            - string
            - 'null'
          format: uri
        error_details:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: >-
            Structured error details providing granular information about validation failures. Each item includes an
            `error_detail_type` discriminator indicating the kind of detail.
      required:
        - error
        - message
      title: Error
    BusinessApplicantLegalEntityType:
      type: string
      enum:
        - CORPORATION
        - LLC
        - NON_PROFIT
        - PARTNERSHIP
        - SOLE_PROPRIETORSHIP
        - TRUST
      description: Type of legal entity.
      title: BusinessApplicantLegalEntityType
    Address:
      type: object
      properties:
        street_address:
          type: string
        city:
          type: string
        country_area:
          type:
            - string
            - 'null'
          description: >-
            Designation of a region, province, or state. Required for US addresses. For onboarding applicant addresses
            with `country: US`, this must be a valid uppercase two-letter USPS state, territory, or military mail code
            (e.g. `CA`, `NY`, `DC`, `PR`, `AE`) — full state names such as `California` are rejected. Free-form for
            non-US addresses.
        postal_code:
          type: string
        country:
          type: string
          description: Two-letter ISO 3166-1 alpha-2 country code.
      required:
        - street_address
        - city
        - postal_code
        - country
      title: Address
    BusinessApplicantIndustry:
      type: string
      enum:
        - BANK
        - CONSTRUCTION
        - CRYPTO
        - E_COMMERCE
        - ENERGY
        - ENTERTAINMENT
        - FINANCIAL_SERVICES
        - GAMBLING
        - HEALTH
        - OPERATING_COMPANY
        - PROFESSIONAL_SERVICES
        - REAL_ESTATE
        - TECHNOLOGY
        - TRADE
        - OTHER
      description: Business industry.
      title: BusinessApplicantIndustry
    BusinessApplicantIndustryFinancialServicesSubtype:
