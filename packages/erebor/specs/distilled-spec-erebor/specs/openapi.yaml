    CreateOnboardingRequest:
      type: object
      properties:
        program_id:
          type: string
          description: >
            Provide to onboard the customer into this program. If supplied alone, no initial deposit account is opened —
            use `POST /deposit_accounts` later to open accounts when the customer is ready. May be supplied alongside
            `deposit_account_template_id` as a confirming assertion; if both are set, the supplied `program_id` must
            match the program the template belongs to.
        person_applicant_id:
          type:
            - string
            - 'null'
        business_applicant_id:
          type:
            - string
            - 'null'
        deposit_account_template_id:
          type: string
          description: >
            Provide to onboard the customer **and** open an initial deposit account from this template on approval. The
            customer is placed in the template's program. May be supplied alongside `program_id`; if both are set, the
            supplied `program_id` must match the template's program.
        disclosures:
          $ref: '#/components/schemas/Disclosures'
        custom_ref:
          $ref: '#/components/schemas/CustomRef'
        custom_fields:
          $ref: '#/components/schemas/CustomFields'
      required:
        - disclosures
      description: >
        At least one of `deposit_account_template_id` or `program_id` must be set. Both may be supplied together: the
        template path is taken (an initial deposit account is opened) and the supplied `program_id` is verified to match
        the program the template belongs to. A mismatch returns `400`.


        - **`deposit_account_template_id` only** — on approval, we create the Customer **and** open an initial deposit
        account from the template. The customer is placed in the template's program.

        - **`program_id` only** — on approval, we create only the Customer in the given program. No initial deposit
        account is opened; open accounts later via `POST /deposit_accounts` when the customer is ready to transact.

        - **Both** — equivalent to providing only `deposit_account_template_id`; the supplied `program_id` is treated as
        a confirming assertion.
      title: CreateOnboardingRequest
    UpdateOnboardingRequest:
      type: object
      properties:
        custom_ref:
          $ref: '#/components/schemas/CustomRef'
        custom_fields:
          $ref: '#/components/schemas/CustomFields'
      title: UpdateOnboardingRequest
