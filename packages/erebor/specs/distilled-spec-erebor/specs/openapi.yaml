        - name: ending_before
          in: query
          description: Cursor for pagination (exclusive end)
          required: false
          schema:
            type: string
        - name: account_id
          in: query
          description: Filter by account ID (matches both source and destination). Mutually exclusive with from_id and to_id.
          required: false
          schema:
            type: string
        - name: from_id
          in: query
          description: Filter by source account or resource ID
          required: false
          schema:
            type: string
        - name: to_id
          in: query
          description: Filter by destination account or resource ID
          required: false
          schema:
            type: string
        - name: transaction_type
          in: query
          description: Filter by transaction type
          required: false
          schema:
            $ref: '#/components/schemas/TransactionsGetParametersTransactionType'
        - name: status
          in: query
          description: Filter by transaction status
          required: false
          schema:
            $ref: '#/components/schemas/TransactionsGetParametersStatus'
        - name: associated_payment_id
          in: query
          description: Filter by associated payment resource ID
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          description: |
            Use your API key in the Authorization header.

            Example: `Authorization: your_api_key_here`
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TRANSACTIONS_listTransactions_Response_200'
