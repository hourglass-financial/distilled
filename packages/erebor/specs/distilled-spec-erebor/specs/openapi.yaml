            Use your API key in the Authorization header.

            Example: `Authorization: your_api_key_here`
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of Onboardings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONBOARDING_listOnboardings_Response_200'
    post:
      operationId: create-onboarding
      summary: Create Onboarding
      description: >
        Start a new Onboarding for a person or business applicant. A successful Onboarding produces a new Customer,
        linked in the result.


        At least one of `deposit_account_template_id` or `program_id` must be provided:


        - **`deposit_account_template_id` only** — on approval, we create the Customer **and** open an initial deposit
        account from the template. The customer is placed in the template's program. Use this when you want a turnkey
        approve→account flow.

        - **`program_id` only** — on approval, we create only the Customer in the given program. No initial deposit
        account is opened; open accounts later by calling `POST /deposit_accounts` when the customer is ready to
        transact.

        - **Both** — equivalent to providing only `deposit_account_template_id`; the supplied `program_id` is treated as
        a confirming assertion. Returns `400` if the supplied `program_id` does not match the program the template
        belongs to.


        Supplying neither field returns `400`. An unrecognised `program_id` (or one you do not manage) returns `404`.


        On approval the `ONBOARDING.APPROVED` event always fires. The `DEPOSIT_ACCOUNT.PENDING` / `DEPOSIT_ACCOUNT.OPEN`
        events only fire when the Onboarding was created with `deposit_account_template_id` (either alone or alongside a
        matching `program_id`).
      tags:
        - subpackage_onboarding
      parameters:
        - name: Authorization
          in: header
          description: |
            Use your API key in the Authorization header.

            Example: `Authorization: your_api_key_here`
          required: true
          schema:
            type: string
        - name: Erebor-Idempotency-Key
          in: header
          description: >
            Optional idempotency key to safely retry requests. If provided, multiple requests with the same key will
            only perform the action once and return the same result (even if the result was an error).
          required: false
          schema:
            type: string
        - name: Erebor-Simulation-Scenario
          in: header
          description: >
            **Sandbox only.** Forces a simulated onboarding outcome so you can exercise success and failure paths.
            Ignored in production, where onboardings always go through real review.


            | Value | Outcome |

            |-------|---------|

            | `ONBOARDING_REJECTED` | The Onboarding status is set to `REJECTED`. No Customer or Deposit Account is
            created. |

            | `ONBOARDING_UNDER_REVIEW` | The Onboarding status is set to `UNDER_REVIEW`. |

            | _(omitted)_ | The Onboarding status is set to `APPROVED` (and opens the initial Deposit Account when
            `deposit_account_template_id` was supplied). |


            An unrecognized value is rejected with `400`. The header name aligns with the platform's `/simulation/`
            endpoints.
          required: false
          schema:
            $ref: '#/components/schemas/OnboardingsPostParametersEreborSimulationScenario'
      responses:
        '200':
          description: Onboarding created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOnboardingRequest'
