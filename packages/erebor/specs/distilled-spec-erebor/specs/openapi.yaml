      required:
        - amount
      description: |
        Request to simulate an inbound ACH transfer.

        Exactly one of `deposit_account_id` OR (`account_number` + `routing_number`) must be provided.
      title: SimulateACHInRequest
    SimulateInboundAchResponse:
      type: object
