webhooks:
  onboarding-event:
    post:
      operationId: onboarding-event
      summary: Onboarding Event
      description: |
        Fired when an onboarding application changes status.

        **Event types:**
        - `ONBOARDING.SUBMITTED` — Application submitted for review
        - `ONBOARDING.UNDER_REVIEW` — Application is being reviewed
        - `ONBOARDING.APPROVED` — Application has been approved
        - `ONBOARDING.REJECTED` — Application has been rejected
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingEvent'
  deposit-account-event:
    post:
      operationId: deposit-account-event
      summary: Deposit Account Event
      description: |
        Fired when a deposit account changes status.

        **Event types:**
        - `DEPOSIT_ACCOUNT.PENDING` — Account created, pending activation
        - `DEPOSIT_ACCOUNT.OPEN` — Account is now open and active
        - `DEPOSIT_ACCOUNT.CLOSED` — Account has been closed
        - `DEPOSIT_ACCOUNT.FROZEN` — Account has been frozen
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositAccountEvent'
  counterparty-event:
    post:
      operationId: counterparty-event
      summary: Counterparty Event
      description: |
        Fired when a counterparty is created, updated, or archived.

        **Event types:**
        - `COUNTERPARTY.CREATED` — A new counterparty has been created
        - `COUNTERPARTY.UPDATED` — A counterparty has been updated
        - `COUNTERPARTY.ARCHIVED` — A counterparty has been archived
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterpartyEvent'
  counterparty-bank-account-event:
    post:
      operationId: counterparty-bank-account-event
      summary: Counterparty Bank Account Event
      description: |
        Fired when a counterparty bank account is created.

        **Event types:**
        - `COUNTERPARTY_BANK_ACCOUNT.CREATED` — A new counterparty bank account has been created
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterpartyBankAccountEvent'
  counterparty-blockchain-address-event:
    post:
      operationId: counterparty-blockchain-address-event
      summary: Counterparty Blockchain Address Event
      description: |
        Fired when a counterparty blockchain address is created or attributed.

