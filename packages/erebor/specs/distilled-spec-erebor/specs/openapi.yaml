openapi: 3.1.0
info:
  title: API Reference
  version: 1.0.0
paths:
  /documents:
    get:
      operationId: list-documents
      summary: List Documents
      description: Retrieve a list of Documents
      tags:
        - subpackage_documents
      parameters:
        - name: page_size
          in: query
          description: Number of items per page (max 100)
          required: false
          schema:
            type: integer
            default: 25
        - name: starting_after
          in: query
          description: Cursor for pagination (exclusive start)
          required: false
          schema:
            type: string
        - name: ending_before
          in: query
          description: Cursor for pagination (exclusive end)
          required: false
          schema:
            type: string
        - name: program_id
          in: query
          description: Filter by program ID
          required: false
          schema:
            type: string
        - name: custom_ref
          in: query
          description: Filter by exact `custom_ref` match (case-sensitive, up to 255 characters).
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          description: |
            Use your API key in the Authorization header.

            Example: `Authorization: your_api_key_here`
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DOCUMENTS_listDocuments_Response_200'
    post:
      operationId: create-document
      summary: Upload Document
      description: Upload a document for Onboarding verification
      tags:
        - subpackage_documents
      parameters:
        - name: Authorization
          in: header
          description: |
            Use your API key in the Authorization header.

            Example: `Authorization: your_api_key_here`
          required: true
          schema:
            type: string
        - name: Erebor-Idempotency-Key
          in: header
          description: >
            Optional idempotency key to safely retry requests. If provided, multiple requests with the same key will
            only perform the action once and return the same result (even if the result was an error).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file to upload
                document_type:
                  $ref: '#/components/schemas/DocumentsPostRequestBodyContentMultipartFormDataSchemaDocumentType'
                  description: Type of document being uploaded
                name:
                  type: string
                  description: Name of the document file
                description:
                  type: string
                  description: Optional description of the document
                program_id:
                  type: string
                  description: Unique identifier for the program this document belongs to
                custom_ref:
                  $ref: '#/components/schemas/CustomRef'
                custom_fields:
                  $ref: '#/components/schemas/CustomFields'
              required:
                - file
                - document_type
                - name
                - program_id
  /documents/{id}:
    get:
      operationId: get-document
      summary: Retrieve Document
      description: Retrieve document metadata and download URL
      tags:
        - subpackage_documents
      parameters:
        - name: id
          in: path
          description: Document ID
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: |
            Use your API key in the Authorization header.

            Example: `Authorization: your_api_key_here`
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
    patch:
      operationId: update-document
      summary: Update Document
      description: >-
        Update a document's `custom_ref` or `custom_fields`. The file contents, name, type, and description are
        immutable.
      tags:
        - subpackage_documents
      parameters:
        - name: id
          in: path
          description: Document ID
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: |
            Use your API key in the Authorization header.

            Example: `Authorization: your_api_key_here`
          required: true
          schema:
            type: string
        - name: Erebor-Idempotency-Key
          in: header
          description: >
            Optional idempotency key to safely retry requests. If provided, multiple requests with the same key will
            only perform the action once and return the same result (even if the result was an error).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Document updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
