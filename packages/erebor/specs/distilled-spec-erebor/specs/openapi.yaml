  /simulation/ach_out/{id}/return:
    post:
      operationId: simulate-ach-out-return
      summary: Simulate Outbound ACH Transfer Return
      description: >
        Force a settled outbound ACH transfer to `RETURNED` for testing. This endpoint is only available in the sandbox
        environment.


        The transfer must be in `SETTLED` status when this endpoint is called; non-`SETTLED` transfers return `409
        Conflict`.


        The response returns immediately with the transfer's CURRENT status (still `SETTLED` at this point). The flip to
        `RETURNED` is asynchronous — usually within a minute. Poll `GET /ach_out/{id}` or listen for the
        `ACH_OUT.RETURNED` webhook to observe the transition.


        Pass an optional `return_code` query parameter to control the return reason code; defaults to `R01`
        (Insufficient Funds).
      tags:
        - subpackage_simulation
      parameters:
        - name: id
          in: path
          description: ID of the outbound ACH transfer to return. Must be in `SETTLED` status.
          required: true
          schema:
            type: string
        - name: return_code
          in: query
          description: >
            NACHA return reason code to apply to the returned transfer. Defaults to `R01` (Insufficient Funds) when
            omitted. Must be a NACHA return reason code matching `^R[0-9]{2}$` (R01-R85). Codes that match the pattern
            but are not in the NACHA set return `400`.
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          description: |
            Use your API key in the Authorization header.

            Example: `Authorization: your_api_key_here`
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            Return accepted. The transfer is still `SETTLED` at response time; poll `GET /ach_out/{id}` or listen for
            the `ACH_OUT.RETURNED` webhook for the flip to `RETURNED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateAchOutReturnResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
