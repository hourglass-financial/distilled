    SimulateAchOutReturnResponse:
      type: object
      properties:
        id:
          type: string
          description: >
            ID of outbound ACH. The transfer is still `SETTLED` at response time; poll `GET /ach_out/{id}` or listen for
            the `ACH_OUT.RETURNED` webhook for the final state.
        return_code:
          type: string
          description: NACHA return reason code specified in the request.
      required:
        - id
        - return_code
      description: >
        Response from forcing a settled outbound ACH transfer to `RETURNED`. The transfer is still `SETTLED` at response
        time; the flip to `RETURNED` is asynchronous.
      title: SimulateAchOutReturnResponse
    SimulateWireOutReturnResponse:
      type: object
      properties:
        id:
          type: string
          description: >
            ID of the outbound wire. The transfer is still `SETTLED` at response time; poll `GET /wire_out/{id}` or
            listen for the `WIRE_OUT.RETURNED` webhook for the final state.
      required:
        - id
      description: >
        Response from forcing a settled outbound wire transfer to `RETURNED`. The transfer is still `SETTLED` at
        response time; the flip to `RETURNED` is asynchronous.
      title: SimulateWireOutReturnResponse
    SimulateInternationalWireInRequest:
      type: object
      properties:
        deposit_account_id:
          type: string
          description: >-
            ID of the deposit account to receive the transfer. Mutually exclusive with `account_number` and
            `routing_number`.
        account_number:
          type: string
          description: >-
            Account number. Must be provided together with `routing_number`. Mutually exclusive with
            `deposit_account_id`.
        routing_number:
          type: string
          description: >-
            9-digit ABA routing number. Must be provided together with `account_number`. Mutually exclusive with
            `deposit_account_id`.
        amount:
          $ref: '#/components/schemas/FiatInAmount'
        originator_name:
          type: string
          description: Name of the originator (sender) on the simulated wire.
        originator_account_number:
          type: string
          description: Originator's IBAN or bank account number (max 34 characters, IBAN-compatible).
        originator_bic:
          type: string
          description: >
            Originator's bank BIC/SWIFT code. Exactly 8 characters (institution + country + location) or 11 characters
            (with the 3-char branch suffix). Case-insensitive; normalized to uppercase server-side.
        originator_additional_account_number_data:
          $ref: '#/components/schemas/AdditionalAccountNumberData'
        memo:
          type:
            - string
            - 'null'
          description: >-
            Optional memo to include in the simulated wire transfer (max 140 characters). Restricted to the SWIFT MT
            field-allowed character set; characters outside this set are rejected by the production wire workflow. Use
            this to test workflows that rely on memo fields for reconciliation.
      required:
        - amount
        - originator_name
        - originator_account_number
        - originator_bic
      description: >
        Request to simulate an inbound international wire transfer.


        Exactly one of `deposit_account_id` OR (`account_number` + `routing_number`) must be provided. The originator
        fields synthesize the sending bank/account; the simulation get-or-creates a counterparty international bank
        account from these so subsequent counterparty list/get calls observe the new sender.
      title: SimulateInternationalWireInRequest
    SimulateInboundInternationalWireResponse:
      type: object
      properties:
        international_wire_in_id:
          type: string
          description: ID of the simulated transfer. Use this directly in `GET /international_wire_in/{id}` to read it back.
        deposit_account_id:
          type: string
          description: ID of the deposit account that received the transfer
        amount:
          $ref: '#/components/schemas/FiatInAmount'
        status:
          $ref: '#/components/schemas/InternationalWireTransferStatus'
      required:
        - international_wire_in_id
        - deposit_account_id
        - amount
        - status
      description: >
        Response from simulating an inbound international wire transfer.


        Status returns `PENDING` immediately after creation; settlement is asynchronous. Poll `GET
        /international_wire_in/{international_wire_in_id}` for the `SETTLED` transition. Idempotent retries reflect the
        existing row's current status — a retry hitting an already-settled row returns `SETTLED`.
      title: SimulateInboundInternationalWireResponse
    SimulateInternationalWireOutReturnResponse:
      type: object
      properties:
        international_wire_out_id:
          type: string
          description: >
            ID of the outbound international wire. The transfer is still `SETTLED` at response time; poll `GET
            /international_wire_out/{id}` or listen for the `INTERNATIONAL_WIRE_OUT.RETURNED` webhook for the final
            state.
      required:
        - international_wire_out_id
      description: >
        Response from forcing a settled outbound international wire transfer to `RETURNED`. The transfer is still
        `SETTLED` at response time; the flip to `RETURNED` is asynchronous.
      title: SimulateInternationalWireOutReturnResponse
    SimulateBlockchainInRequest:
