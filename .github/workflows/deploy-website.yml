name: Deploy Website

# HOURGLASS PATCH: GitHub Actions pinned to full commit SHAs (org policy requires it).
on:
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build core
        run: bun run build
        working-directory: packages/core

      - name: Build cloudflare SDK
        run: bun run build
        working-directory: packages/cloudflare

      - name: Deploy website
        run: bun run deploy
        working-directory: www/distilled.cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEBSITE_CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.WEBSITE_CLOUDFLARE_ACCOUNT_ID }}
          ZONE_ID: ${{ secrets.WEBSITE_CLOUDFLARE_ZONE_ID }}
