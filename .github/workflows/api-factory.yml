name: API Factory CI

# Deliberately minimal stub for the standalone v2 api-factory/ workspace.
# The full v2 CI topology (live-API suites, nightly lanes, publish gates) is a
# separate upcoming decision — this lane only runs check + test on the skeleton.
#
# Every GitHub Action is pinned to a full commit SHA (with a trailing version
# comment) per the hourglass-financial org SHA-pinning requirement. SHAs mirror
# .github/workflows/test.yml.
on:
  push:
    branches: [main]
    paths:
      - "api-factory/**"
      - ".github/workflows/api-factory.yml"
  pull_request:
    branches: [main]
    paths:
      - "api-factory/**"
      - ".github/workflows/api-factory.yml"
  workflow_dispatch:

concurrency:
  group: api-factory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: api-factory
      - run: bun run check
        working-directory: api-factory
      - run: bun run test
        working-directory: api-factory
